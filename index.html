<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>J.A.R.V.I.S</title>
  <meta name="description" content="Just A Rather Very Intelligent System — AI Assistant" />

  <!-- PWA -->
  <link rel="manifest" href="/public/manifest.json" />
  <meta name="theme-color" content="#070d1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JARVIS" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #3b82f6;
      --blue-light: #93c5fd;
      --blue-dim: #1d4ed8;
      --bg: #070d1a;
      --text: #e2e8f0;
      --text-dim: #64748b;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 1rem;
      padding-top: max(2rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
    }

    header { text-align: center; }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.4em;
      color: var(--blue-light);
      text-shadow: 0 0 20px rgba(59,130,246,0.6);
    }
    header p {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: var(--text-dim);
      margin-top: 0.25rem;
    }

    #orb-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      cursor: pointer;
      flex-shrink: 0;
    }
    #orb-wrap svg { width: 100%; height: 100%; overflow: visible; }

    .pulse-ring { transform-origin: center; animation: none; }
    #orb-wrap.listening .pulse-ring { animation: pulse 1.2s ease-out infinite; }
    @keyframes pulse {
      0%   { opacity: 0.8; transform: scale(1); }
      100% { opacity: 0;   transform: scale(1.6); }
    }

    .rotate-ring { transform-origin: center; }
    #orb-wrap.thinking .rotate-ring,
    #orb-wrap.speaking .rotate-ring { animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #orb-wrap.listening #core { fill: #2563eb; filter: drop-shadow(0 0 18px #3b82f6); }
    #orb-wrap.thinking  #core { fill: #7c3aed; filter: drop-shadow(0 0 18px #a78bfa); }
    #orb-wrap.speaking  #core { fill: #059669; filter: drop-shadow(0 0 18px #34d399); }
    #core { transition: fill 0.4s, filter 0.4s; filter: drop-shadow(0 0 8px rgba(59,130,246,0.4)); }

    #status {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--blue-light);
      text-transform: uppercase;
      height: 1.2em;
      text-align: center;
    }

    #transcript-wrap {
      width: 100%;
      max-width: 540px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      overflow-y: auto;
      padding: 0.5rem 0;
      scrollbar-width: thin;
      scrollbar-color: var(--blue-dim) transparent;
    }
    .msg {
      max-width: 85%;
      padding: 0.6rem 0.9rem;
      border-radius: 1rem;
      font-size: 0.9rem;
      line-height: 1.5;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user {
      align-self: flex-end;
      background: rgba(59,130,246,0.2);
      border: 1px solid rgba(59,130,246,0.3);
      color: var(--blue-light);
    }
    .msg.jarvis {
      align-self: flex-start;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
    }

    #input-row { display: flex; gap: 0.5rem; width: 100%; max-width: 540px; }
    #text-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 2rem;
      padding: 0.6rem 1rem;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #text-input::placeholder { color: var(--text-dim); }
    #text-input:focus { border-color: var(--blue); }
    #send-btn {
      background: var(--blue);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #send-btn:hover { background: var(--blue-dim); }
    #send-btn svg { width: 18px; height: 18px; fill: white; }

    #mic-hint {
      font-size: 0.65rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-align: center;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>J.A.R.V.I.S</h1>
    <p>JUST A RATHER VERY INTELLIGENT SYSTEM</p>
  </header>

  <div id="orb-wrap" title="Click to speak">
    <svg viewBox="0 0 200 200">
      <circle class="pulse-ring" cx="100" cy="100" r="90" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0"/>
      <circle cx="100" cy="100" r="88" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
      <circle class="rotate-ring" cx="100" cy="100" r="76" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="8 6" opacity="0.6"/>
      <circle cx="100" cy="100" r="62" fill="none" stroke="#1e3a5f" stroke-width="1"/>
      <g stroke="#3b82f6" stroke-width="1" opacity="0.4">
        <line x1="100" y1="38" x2="100" y2="162"/>
        <line x1="46" y1="69" x2="154" y2="131"/>
        <line x1="46" y1="131" x2="154" y2="69"/>
      </g>
      <circle id="core" cx="100" cy="100" r="44" fill="#1d4ed8"/>
      <circle cx="100" cy="100" r="30" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.7"/>
      <circle cx="100" cy="100" r="10" fill="#bfdbfe" opacity="0.9"/>
    </svg>
  </div>

  <div id="status">STANDBY</div>
  <div id="transcript-wrap"></div>

  <div id="input-row">
    <input id="text-input" type="text" placeholder="Type a message…" autocomplete="off" />
    <button id="send-btn" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

  <div id="mic-hint">TAP ORB TO SPEAK</div>
</div>

<script>
(function () {
  let state = 'idle';
  const history = [];
  let recognition = null;
  let synth = window.speechSynthesis;

  const orb       = document.getElementById('orb-wrap');
  const statusEl  = document.getElementById('status');
  const transcript = document.getElementById('transcript-wrap');
  const textInput = document.getElementById('text-input');
  const sendBtn   = document.getElementById('send-btn');

  function setState(s) {
    state = s;
    orb.className = s;
    const labels = { idle: 'STANDBY', listening: 'LISTENING…', thinking: 'PROCESSING…', speaking: 'SPEAKING…' };
    statusEl.textContent = labels[s] || 'STANDBY';
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'jarvis');
    div.textContent = text;
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
  }

  async function askJarvis(userText) {
    history.push({ role: 'user', text: userText });
    addMessage('user', userText);
    setState('thinking');
    try {
      const res = await fetch('/api/jarvis', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
     const data = await res.json();
     const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'API error ' + res.status);
      history.push({ role: 'model', text: reply });
      addMessage('jarvis', reply);
      speak(reply);
    } catch (err) {
      addMessage('jarvis', 'System error: ' + err.message);
      setState('idle');
    }
  }

  function speak(text) {
    if (!synth) { setState('idle'); return; }
    synth.cancel();
    setState('speaking');
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.05;
    utter.pitch = 0.85;
    const voices = synth.getVoices();
    const preferred = voices.find(v =>
      v.name.includes('Daniel') || v.name.includes('Google UK') || v.name.includes('David')
    ) || voices.find(v => v.lang.startsWith('en'));
    if (preferred) utter.voice = preferred;
    utter.onend = () => setState('idle');
    utter.onerror = () => setState('idle');
    synth.speak(utter);
  }

  function startListening() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { addMessage('jarvis', 'Voice input is not supported in this browser. Please use Chrome or Edge.'); return; }
    if (state === 'listening') { recognition && recognition.stop(); return; }
    synth && synth.cancel();
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    setState('listening');
    recognition.onresult = (e) => { const t = e.results[0][0].transcript.trim(); if (t) askJarvis(t); };
    recognition.onerror = () => setState('idle');
    recognition.onend = () => { if (state === 'listening') setState('idle'); };
    recognition.start();
  }

  orb.addEventListener('click', startListening);
  sendBtn.addEventListener('click', () => {
    const text = textInput.value.trim();
    if (!text) return;
    textInput.value = '';
    askJarvis(text);
  });
  textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBtn.click(); });

  if (synth) { synth.getVoices(); synth.onvoiceschanged = () => synth.getVoices(); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/public/sw.js').catch(() => {});

  setState('idle');
})();
</script>
</body>
</html>
