<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>J.A.R.V.I.S</title>
  <meta name="description" content="Just A Rather Very Intelligent System — AI Assistant" />
  <link rel="manifest" href="/public/manifest.json" />
  <meta name="theme-color" content="#070d1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JARVIS" />

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #3b82f6; --blue-light: #93c5fd; --blue-dim: #1d4ed8;
      --bg: #070d1a; --text: #e2e8f0; --text-dim: #64748b;
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden; overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    #app {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 2rem 1rem;
      padding-top: max(2rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
    }
    header { text-align: center; }
    header h1 {
      font-size: 2rem; font-weight: 700; letter-spacing: 0.4em;
      color: var(--blue-light); text-shadow: 0 0 20px rgba(59,130,246,0.6);
    }
    header p { font-size: 0.7rem; letter-spacing: 0.25em; color: var(--text-dim); margin-top: 0.25rem; }

    #orb-wrap { position: relative; width: 200px; height: 200px; cursor: pointer; flex-shrink: 0; }
    #orb-wrap svg { width: 100%; height: 100%; overflow: visible; }
    .pulse-ring { transform-origin: center; animation: none; }
    #orb-wrap.listening .pulse-ring { animation: pulse 1.2s ease-out infinite; }
    #orb-wrap.wake .pulse-ring { animation: pulse 3s ease-out infinite; opacity: 0.4; }
    @keyframes pulse { 0% { opacity: 0.8; transform: scale(1); } 100% { opacity: 0; transform: scale(1.6); } }
    .rotate-ring { transform-origin: center; }
    #orb-wrap.thinking .rotate-ring, #orb-wrap.speaking .rotate-ring { animation: spin 3s linear infinite; }
    #orb-wrap.wake .rotate-ring { animation: spin 8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #orb-wrap.listening #core { fill: #2563eb; filter: drop-shadow(0 0 18px #3b82f6); }
    #orb-wrap.thinking  #core { fill: #7c3aed; filter: drop-shadow(0 0 18px #a78bfa); }
    #orb-wrap.speaking  #core { fill: #059669; filter: drop-shadow(0 0 18px #34d399); }
    #orb-wrap.wake      #core { fill: #0f2a4a; filter: drop-shadow(0 0 6px rgba(59,130,246,0.2)); }
    #core { transition: fill 0.4s, filter 0.4s; filter: drop-shadow(0 0 8px rgba(59,130,246,0.4)); }

    #status { font-size: 0.75rem; letter-spacing: 0.2em; color: var(--blue-light); text-transform: uppercase; height: 1.2em; text-align: center; }

    #transcript-wrap {
      width: 100%; max-width: 640px; flex: 1; min-height: 0;
      display: flex; flex-direction: column; gap: 0.75rem;
      overflow-y: auto; padding: 0.5rem 0;
      scrollbar-width: thin; scrollbar-color: var(--blue-dim) transparent;
    }
    .msg {
      max-width: 90%; padding: 0.75rem 1rem; border-radius: 1rem;
      font-size: 0.9rem; line-height: 1.6; animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user {
      align-self: flex-end;
      background: rgba(59,130,246,0.2); border: 1px solid rgba(59,130,246,0.3);
      color: var(--blue-light);
    }
    .msg.jarvis {
      align-self: flex-start;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
    }

    /* Markdown styles inside jarvis messages */
    .msg.jarvis p { margin-bottom: 0.5rem; }
    .msg.jarvis p:last-child { margin-bottom: 0; }
    .msg.jarvis ul, .msg.jarvis ol { padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .msg.jarvis li { margin-bottom: 0.2rem; }
    .msg.jarvis strong { color: var(--blue-light); font-weight: 600; }
    .msg.jarvis em { color: #a5b4fc; }
    .msg.jarvis h1, .msg.jarvis h2, .msg.jarvis h3 {
      color: var(--blue-light); margin: 0.5rem 0 0.25rem; font-size: 1rem;
    }
    .msg.jarvis code {
      background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.2);
      border-radius: 0.25rem; padding: 0.1rem 0.35rem;
      font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.82rem;
      color: #93c5fd;
    }
    .msg.jarvis pre {
      background: rgba(0,0,0,0.4); border: 1px solid rgba(59,130,246,0.2);
      border-radius: 0.5rem; padding: 0.75rem; overflow-x: auto;
      margin: 0.5rem 0;
    }
    .msg.jarvis pre code {
      background: none; border: none; padding: 0;
      font-size: 0.82rem; color: #e2e8f0;
    }
    .msg.jarvis blockquote {
      border-left: 3px solid var(--blue); padding-left: 0.75rem;
      color: var(--text-dim); margin: 0.5rem 0;
    }
    .msg.jarvis a { color: var(--blue-light); text-decoration: underline; }
    .msg.jarvis hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 0.5rem 0; }
    .msg.jarvis table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; font-size: 0.82rem; }
    .msg.jarvis th, .msg.jarvis td { border: 1px solid rgba(59,130,246,0.2); padding: 0.35rem 0.6rem; text-align: left; }
    .msg.jarvis th { background: rgba(59,130,246,0.15); color: var(--blue-light); }

    /* Typing indicator */
    .msg.typing { padding: 0.75rem 1rem; }
    .typing-dots { display: flex; gap: 4px; align-items: center; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--blue-light); opacity: 0.4;
      animation: dot-bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    #input-row { display: flex; gap: 0.5rem; width: 100%; max-width: 640px; }
    #text-input {
      flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(59,130,246,0.3);
      border-radius: 2rem; padding: 0.6rem 1rem; color: var(--text); font-size: 0.9rem;
      outline: none; transition: border-color 0.2s;
    }
    #text-input::placeholder { color: var(--text-dim); }
    #text-input:focus { border-color: var(--blue); }
    #send-btn {
      background: var(--blue); border: none; border-radius: 50%;
      width: 40px; height: 40px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.2s;
    }
    #send-btn:hover { background: var(--blue-dim); }
    #send-btn:disabled { background: var(--text-dim); cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; fill: white; }

    #bottom-bar { display: flex; gap: 0.75rem; align-items: center; }
    #mic-hint { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 0.1em; }
    #wake-btn {
      background: transparent; border: 1px solid rgba(59,130,246,0.3);
      border-radius: 2rem; padding: 0.4rem 0.9rem; color: var(--text-dim);
      font-size: 0.65rem; letter-spacing: 0.1em; cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    #wake-btn.active { border-color: var(--blue); color: var(--blue-light); }

    #install-banner {
      display: none; position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(7,13,26,0.97); border-top: 1px solid rgba(59,130,246,0.3);
      padding: 0.75rem 1rem; gap: 0.75rem;
      align-items: center; justify-content: space-between;
      font-size: 0.8rem; z-index: 100;
    }
    #install-banner.show { display: flex; }
    #install-banner button {
      background: var(--blue); border: none; border-radius: 1rem;
      padding: 0.4rem 1rem; color: white; cursor: pointer; font-size: 0.8rem; white-space: nowrap;
    }
    #install-dismiss { background: transparent !important; color: var(--text-dim) !important; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>J.A.R.V.I.S</h1>
    <p>JUST A RATHER VERY INTELLIGENT SYSTEM</p>
  </header>

  <div id="orb-wrap" title="Click to speak">
    <svg viewBox="0 0 200 200">
      <circle class="pulse-ring" cx="100" cy="100" r="90" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0"/>
      <circle cx="100" cy="100" r="88" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
      <circle class="rotate-ring" cx="100" cy="100" r="76" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="8 6" opacity="0.6"/>
      <circle cx="100" cy="100" r="62" fill="none" stroke="#1e3a5f" stroke-width="1"/>
      <g stroke="#3b82f6" stroke-width="1" opacity="0.4">
        <line x1="100" y1="38" x2="100" y2="162"/>
        <line x1="46" y1="69" x2="154" y2="131"/>
        <line x1="46" y1="131" x2="154" y2="69"/>
      </g>
      <circle id="core" cx="100" cy="100" r="44" fill="#1d4ed8"/>
      <circle cx="100" cy="100" r="30" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.7"/>
      <circle cx="100" cy="100" r="10" fill="#bfdbfe" opacity="0.9"/>
    </svg>
  </div>

  <div id="status">STANDBY</div>
  <div id="transcript-wrap"></div>

  <div id="input-row">
    <input id="text-input" type="text" placeholder="Ask JARVIS anything…" autocomplete="off" />
    <button id="send-btn" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

  <div id="bottom-bar">
    <div id="mic-hint">TAP ORB TO SPEAK</div>
    <button id="wake-btn">WAKE WORD OFF</button>
  </div>
</div>

<div id="install-banner">
  <span>Add JARVIS to your home screen</span>
  <div style="display:flex;gap:0.5rem;">
    <button id="install-dismiss">Later</button>
    <button id="install-btn">Install</button>
  </div>
</div>

<script>
(function () {
  // Configure marked
  marked.setOptions({ breaks: true, gfm: true });

  let state = 'idle';
  const history = [];
  let recognition = null;
  let wakeRecognition = null;
  let wakeEnabled = false;
  let synth = window.speechSynthesis;
  let deferredPrompt = null;
  let typingEl = null;

  const orb          = document.getElementById('orb-wrap');
  const statusEl     = document.getElementById('status');
  const transcript   = document.getElementById('transcript-wrap');
  const textInput    = document.getElementById('text-input');
  const sendBtn      = document.getElementById('send-btn');
  const wakeBtn      = document.getElementById('wake-btn');
  const installBanner  = document.getElementById('install-banner');
  const installBtn     = document.getElementById('install-btn');
  const installDismiss = document.getElementById('install-dismiss');

  // ── State ──────────────────────────────────────────────
  function setState(s) {
    state = s;
    orb.className = s;
    const labels = {
      idle: 'STANDBY', listening: 'LISTENING…',
      thinking: 'PROCESSING…', speaking: 'SPEAKING…',
      wake: 'WAKE WORD ACTIVE'
    };
    statusEl.textContent = labels[s] || 'STANDBY';
    sendBtn.disabled = (s === 'thinking');
  }

  // ── Messages ───────────────────────────────────────────
  function addMessage(role, text) {
    removeTyping();
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'jarvis');
    if (role === 'user') {
      div.textContent = text;
    } else {
      // Render markdown for JARVIS responses
      div.innerHTML = marked.parse(text);
      // Open links in new tab
      div.querySelectorAll('a').forEach(a => a.setAttribute('target', '_blank'));
    }
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function showTyping() {
    removeTyping();
    typingEl = document.createElement('div');
    typingEl.className = 'msg jarvis typing';
    typingEl.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    transcript.appendChild(typingEl);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function removeTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  // ── API ────────────────────────────────────────────────
  async function askJarvis(userText) {
    history.push({ role: 'user', text: userText });
    addMessage('user', userText);
    setState('thinking');
    showTyping();
    try {
      const res = await fetch('/api/jarvis', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      let data;
      try { data = await res.json(); }
      catch (e) { throw new Error('Server crashed (status ' + res.status + ')'); }
      if (!res.ok) throw new Error(data.error || 'API error ' + res.status);
      const reply = data.reply || 'I have no response.';
      history.push({ role: 'model', text: reply });
      addMessage('jarvis', reply);
      speak(reply);
    } catch (err) {
      addMessage('jarvis', '**System error:** ' + err.message);
      if (wakeEnabled) setState('wake'); else setState('idle');
    }
  }

  // ── TTS ────────────────────────────────────────────────
  function speak(text) {
    if (!synth) { if (wakeEnabled) setState('wake'); else setState('idle'); return; }
    // Strip markdown for speech
    const plain = text
      .replace(/```[\s\S]*?```/g, 'code block')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\*\*(.*?)\*\*/g, '$1')
      .replace(/\*(.*?)\*/g, '$1')
      .replace(/#{1,6}\s/g, '')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .replace(/^\s*[-*+]\s/gm, '')
      .replace(/^\s*\d+\.\s/gm, '');
    synth.cancel();
    setState('speaking');
    const utter = new SpeechSynthesisUtterance(plain);
    utter.rate = 1.05; utter.pitch = 0.85;
    const voices = synth.getVoices();
    const preferred = voices.find(v =>
      v.name.includes('Daniel') || v.name.includes('Google UK') || v.name.includes('David')
    ) || voices.find(v => v.lang.startsWith('en'));
    if (preferred) utter.voice = preferred;
    utter.onend = () => { if (wakeEnabled) setState('wake'); else setState('idle'); };
    utter.onerror = () => { if (wakeEnabled) setState('wake'); else setState('idle'); };
    synth.speak(utter);
  }

  // ── Manual listen ──────────────────────────────────────
  function startListening() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { addMessage('jarvis', 'Voice input requires Chrome or Edge.'); return; }
    if (state === 'listening') { recognition && recognition.stop(); return; }
    synth && synth.cancel();
    if (wakeRecognition) { try { wakeRecognition.stop(); } catch(e) {} }
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    setState('listening');
    recognition.onresult = (e) => { const t = e.results[0][0].transcript.trim(); if (t) askJarvis(t); };
    recognition.onerror = () => { if (wakeEnabled) { setState('wake'); startWakeWord(); } else setState('idle'); };
    recognition.onend   = () => { if (state === 'listening') { if (wakeEnabled) { setState('wake'); startWakeWord(); } else setState('idle'); } };
    recognition.start();
  }

  // ── Wake word ──────────────────────────────────────────
  function startWakeWord() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR || !wakeEnabled || (state !== 'wake' && state !== 'idle')) return;
    wakeRecognition = new SR();
    wakeRecognition.lang = 'en-US';
    wakeRecognition.continuous = false;
    wakeRecognition.interimResults = false;
    wakeRecognition.onresult = (e) => {
      const said = e.results[0][0].transcript.toLowerCase().trim();
      if (said.includes('jarvis')) { startListening(); }
      else { setTimeout(() => { if (wakeEnabled && state === 'wake') startWakeWord(); }, 100); }
    };
    wakeRecognition.onerror = () => { setTimeout(() => { if (wakeEnabled && (state === 'wake' || state === 'idle')) startWakeWord(); }, 1000); };
    wakeRecognition.onend   = () => { if (wakeEnabled && (state === 'wake' || state === 'idle')) setTimeout(() => startWakeWord(), 100); };
    try { wakeRecognition.start(); } catch(e) {}
  }

  function toggleWake() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { addMessage('jarvis', 'Wake word requires Chrome or Edge.'); return; }
    wakeEnabled = !wakeEnabled;
    wakeBtn.textContent = wakeEnabled ? 'WAKE WORD ON' : 'WAKE WORD OFF';
    wakeBtn.classList.toggle('active', wakeEnabled);
    if (wakeEnabled) {
      setState('wake'); startWakeWord();
      addMessage('jarvis', 'Wake word activated. Say **"JARVIS"** at any time to speak.');
    } else {
      if (wakeRecognition) { try { wakeRecognition.stop(); } catch(e) {} wakeRecognition = null; }
      setState('idle');
    }
  }

  // ── Events ─────────────────────────────────────────────
  orb.addEventListener('click', () => {
    if (state === 'wake' || state === 'idle') startListening();
    else if (state === 'listening') recognition && recognition.stop();
  });
  sendBtn.addEventListener('click', () => {
    const text = textInput.value.trim();
    if (!text || state === 'thinking') return;
    textInput.value = ''; askJarvis(text);
  });
  textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) sendBtn.click(); });
  wakeBtn.addEventListener('click', toggleWake);

  // ── Voices ─────────────────────────────────────────────
  if (synth) { synth.getVoices(); synth.onvoiceschanged = () => synth.getVoices(); }

  // ── PWA ────────────────────────────────────────────────
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredPrompt = e;
    installBanner.classList.add('show');
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null; installBanner.classList.remove('show');
  });
  installDismiss.addEventListener('click', () => installBanner.classList.remove('show'));
  window.addEventListener('appinstalled', () => { installBanner.classList.remove('show'); deferredPrompt = null; });

  // ── Service Worker ─────────────────────────────────────
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/public/sw.js').catch(() => {});

  setState('idle');
})();
</script>
</body>
</html>
