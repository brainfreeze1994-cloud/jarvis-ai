<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H·E·N·R·Y™ - Chemistry Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            padding: 12px 24px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .tab-btn:hover, .tab-btn.active {
            background: rgba(255,255,255,0.3);
            border-color: #fff;
            transform: translateY(-2px);
        }
        
        .tab-content {
            display: none;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Periodic Table Grid */
        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 5px;
            overflow-x: auto;
            padding: 20px;
        }
        
        .element {
            aspect-ratio: 1;
            min-width: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            position: relative;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .element:hover {
            transform: scale(1.2);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .element .number {
            font-size: 8px;
            position: absolute;
            top: 2px;
            left: 4px;
        }
        
        .element .symbol {
            font-size: 20px;
            font-weight: bold;
        }
        
        .element .name {
            font-size: 8px;
            text-align: center;
        }
        
        /* Category Colors */
        .nonmetal { background: #4CAF50; }
        .noble-gas { background: #9C27B0; }
        .alkali-metal { background: #F44336; }
        .alkaline-earth { background: #FF9800; }
        .metalloid { background: #009688; }
        .halogen { background: #03A9F4; }
        .transition-metal { background: #607D8B; }
        .post-transition { background: #795548; }
        .lanthanide { background: #3F51B5; }
        .actinide { background: #E91E63; }
        
        /* Molecular Structure Viewer */
        .structure-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }
        
        .molecule-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .molecule-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .molecule-btn:hover, .molecule-btn.active {
            background: rgba(255,255,255,0.4);
            transform: scale(1.05);
        }
        
        .structure-canvas {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .structure-info {
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            padding: 20px;
        }
        
        .structure-info h3 {
            margin-bottom: 15px;
            font-size: 24px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .info-label {
            font-weight: bold;
            color: #81D4FA;
        }
        
        /* Export Section */
        .export-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .export-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .export-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        /* Space Tracker */
        .space-data {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .space-card {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 25px;
            border-left: 5px solid #00BCD4;
        }
        
        .space-card h3 {
            margin-bottom: 15px;
            color: #00BCD4;
        }
        
        .comparison-list {
            list-style: none;
            margin-top: 10px;
        }
        
        .comparison-list li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .comparison-list strong {
            color: #FFD700;
        }
        
        @media (max-width: 768px) {
            .structure-container {
                grid-template-columns: 1fr;
            }
            .periodic-table {
                grid-template-columns: repeat(18, 50px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 H·E·N·R·Y™ Chemistry Lab</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('periodic')"> Periodic Table</button>
            <button class="tab-btn" onclick="switchTab('molecules')">🔬 Molecular Structures</button>
            <button class="tab-btn" onclick="switchTab('export')">📁 Export Data</button>
            <button class="tab-btn" onclick="switchTab('space')">🌌 Space Tracker</button>
        </div>
        
        <!-- Periodic Table Tab -->
        <div id="periodic" class="tab-content active">
            <h2 style="margin-bottom: 20px;">Interactive Periodic Table</h2>
            <div class="periodic-table" id="periodicTable"></div>
            <div id="elementDetails" style="margin-top: 30px; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 10px; display: none;">
                <h3 id="elName"></h3>
                <p id="elInfo"></p>
            </div>
        </div>
        
        <!-- Molecular Structures Tab -->
        <div id="molecules" class="tab-content">
            <h2 style="margin-bottom: 20px;">Molecular Structure Viewer</h2>
            <div class="molecule-selector">
                <button class="molecule-btn active" onclick="showMolecule('H2O')">H₂O (Water)</button>
                <button class="molecule-btn" onclick="showMolecule('CO2')">CO₂ (Carbon Dioxide)</button>
                <button class="molecule-btn" onclick="showMolecule('CH4')">CH₄ (Methane)</button>
                <button class="molecule-btn" onclick="showMolecule('NH3')">NH₃ (Ammonia)</button>
                <button class="molecule-btn" onclick="showMolecule('NaCl')">NaCl (Salt)</button>
                <button class="molecule-btn" onclick="showMolecule('C6H12O6')">C₆H₁₂O₆ (Glucose)</button>
            </div>
            
            <div class="structure-container">
                <div class="structure-canvas" id="structureCanvas">
                    <canvas id="moleculeCanvas" width="500" height="500"></canvas>
                </div>
                <div class="structure-info" id="structureInfo">
                    <!-- Info populated by JS -->
                </div>
            </div>
        </div>
        
        <!-- Export Tab -->
        <div id="export" class="tab-content">
            <h2 style="margin-bottom: 20px;">Export Chemistry Data</h2>
            <p style="margin-bottom: 20px;">Download periodic table data in various formats:</p>
            <div class="export-buttons">
                <button class="export-btn" onclick="exportToExcel()">📊 Export to Excel (.xlsx)</button>
                <button class="export-btn" onclick="exportToPDF()">📄 Export to PDF</button>
                <button class="export-btn" onclick="exportToJSON()"> Export to JSON</button>
                <button class="export-btn" onclick="exportToCSV()"> Export to CSV</button>
            </div>
            <div id="exportStatus" style="margin-top: 20px; padding: 15px; border-radius: 8px; display: none;"></div>
        </div>
        
        <!-- Space Tracker Tab -->
        <div id="space" class="tab-content">
            <h2 style="margin-bottom: 20px;">🛰️ Live Space Tracking</h2>
            <div class="space-data">
                <div class="space-card">
                    <h3>🛰️ International Space Station</h3>
                    <div id="issData">Loading...</div>
                    <button class="export-btn" onclick="refreshISS()" style="margin-top: 15px; padding: 10px 20px;"> Refresh</button>
                </div>
                <div class="space-card">
                    <h3>☄️ Asteroid Watch</h3>
                    <div id="asteroidData">Loading...</div>
                    <button class="export-btn" onclick="refreshAsteroids()" style="margin-top: 15px; padding: 10px 20px;">🔄 Refresh</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="chemistry.js"></script>
</body>
</html>
